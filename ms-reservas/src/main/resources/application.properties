spring.application.name=ms-reservas

# --- Servidor -----------------------------------------------------------------
server.port=${SERVER_PORT:8084}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/}
# Prefijo opcional de los endpoints (ej. /api/v1). Vacio por defecto.
app.api.base-path=${API_BASE_PATH:}

# --- Base de datos compartida (Supabase / PostgreSQL) -------------------------
# DB_URL, DB_USERNAME y DB_PASSWORD se toman del entorno o de un archivo .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=${JPA_BATCH_FETCH_SIZE:50}

# El esquema es compartido: solo se migra si se habilita explicitamente
spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=${DB_SCHEMA:public}

# --- Paginacion ---------------------------------------------------------------
app.pagination.default-size=${PAGINATION_DEFAULT_SIZE:10}
app.pagination.max-size=${PAGINATION_MAX_SIZE:100}

# --- Reglas de negocio de reservas --------------------------------------------
# Valor por defecto; si existe el setting "min_advance_hours" en BD, este tiene prioridad
app.booking.min-advance-hours=${BOOKING_MIN_ADVANCE_HOURS:24}
app.booking.min-advance-setting-key=${BOOKING_MIN_ADVANCE_SETTING_KEY:min_advance_hours}
# Zona horaria de las franjas (vacio = zona del sistema)
app.booking.zone-id=${BOOKING_ZONE_ID:}

# --- Swagger / OpenAPI --------------------------------------------------------
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false
app.openapi.server-url=${GATEWAY_PUBLIC_URL:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.reservas.ms_reservas.controller
app.openapi.description=Reservas de tutorias: reserva (cabecera) y tipos de consulta (detalle M:N)
app.openapi.version=${APP_VERSION:1.0.0}

# --- Eureka (registro y descubrimiento) ---------------------------------------
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.registry-fetch-interval-seconds=${EUREKA_FETCH_INTERVAL_SECONDS:30}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_RENEWAL_INTERVAL_SECONDS:10}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_EXPIRATION_SECONDS:30}

# --- Actuator -----------------------------------------------------------------
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=never

# --- Logs (SLF4J / Logback) ---------------------------------------------------
# Controller: INFO (solicitudes) | Service: DEBUG (pasos de negocio) | Repository: DEBUG (consultas)
# Log diario en texto plano: logs/ms-reservas-YYYY-MM-DD.log (ver logback-spring.xml)
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:14}
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.reservas.ms_reservas.controller=${LOG_LEVEL_CONTROLLER:INFO}
logging.level.com.reservas.ms_reservas.service=${LOG_LEVEL_SERVICE:DEBUG}
logging.level.com.reservas.ms_reservas.repository=${LOG_LEVEL_REPOSITORY:DEBUG}
logging.level.com.reservas.ms_reservas.exception=${LOG_LEVEL_EXCEPTION:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}
