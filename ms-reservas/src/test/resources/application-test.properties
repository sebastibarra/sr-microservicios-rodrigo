spring.datasource.url=jdbc:h2:mem:reservas;MODE=PostgreSQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=PUBLIC
spring.liquibase.enabled=false
eureka.client.enabled=false
app.security.jwt.secret=test-only-signing-secret-with-at-least-32-bytes
logging.file.name=target/test-logs/ms-reservas.log
