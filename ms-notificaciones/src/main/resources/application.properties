spring.application.name=ms-notificaciones

# --- Servidor -----------------------------------------------------------------
server.port=${SERVER_PORT:8083}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/}
# Prefijo opcional de los endpoints (ej. /api/v1). Vacio por defecto.
app.api.base-path=${API_BASE_PATH:}

# --- Base de datos compartida (Supabase / PostgreSQL) -------------------------
# DB_URL, DB_USERNAME y DB_PASSWORD se toman del entorno o de un archivo .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=${JPA_BATCH_FETCH_SIZE:50}

# El esquema es compartido: solo se migra si se habilita explicitamente
spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=${DB_SCHEMA:public}

# --- Paginacion ---------------------------------------------------------------
app.pagination.default-size=${PAGINATION_DEFAULT_SIZE:10}
app.pagination.max-size=${PAGINATION_MAX_SIZE:100}

# --- Correo -------------------------------------------------------------------
# enabled=false: no se envia por SMTP, el correo solo se registra en el log (util en desarrollo)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@reservas.local}
app.mail.support-address=${MAIL_SUPPORT_ADDRESS:soporte@reservas.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:5000}
management.health.mail.enabled=false

# --- Swagger / OpenAPI --------------------------------------------------------
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false
app.openapi.server-url=${GATEWAY_PUBLIC_URL:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.reservas.ms_notificaciones.controller
app.openapi.description=Notificaciones por correo: plantillas, envios y formulario de contacto
app.openapi.version=${APP_VERSION:1.0.0}

# --- Eureka (registro y descubrimiento) ---------------------------------------
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.registry-fetch-interval-seconds=${EUREKA_FETCH_INTERVAL_SECONDS:30}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_RENEWAL_INTERVAL_SECONDS:10}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_EXPIRATION_SECONDS:30}

# --- Actuator -----------------------------------------------------------------
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=never

# --- Logs (SLF4J / Logback) ---------------------------------------------------
# Controller: INFO (solicitudes) | Service: DEBUG (pasos de negocio) | Repository: DEBUG (consultas)
# Log diario en texto plano: logs/ms-notificaciones-YYYY-MM-DD.log (ver logback-spring.xml)
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:14}
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.reservas.ms_notificaciones.controller=${LOG_LEVEL_CONTROLLER:INFO}
logging.level.com.reservas.ms_notificaciones.service=${LOG_LEVEL_SERVICE:DEBUG}
logging.level.com.reservas.ms_notificaciones.repository=${LOG_LEVEL_REPOSITORY:DEBUG}
logging.level.com.reservas.ms_notificaciones.mail=${LOG_LEVEL_MAIL:INFO}
logging.level.com.reservas.ms_notificaciones.exception=${LOG_LEVEL_EXCEPTION:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}
